name: CD - Build, Push and Deploy (Ejercicio 4)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lab5-2-ejercicio4:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/lab5-2-ejercicio4:latest

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/lab5-2-ejercicio4:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en servidor remoto
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/lab5-2-ejercicio4:latest"
            
            # 1. Desplegar la nueva imagen en un puerto alterno (3001) para validacion
            docker pull $IMAGE
            docker run -d \
              --name lab5-2-ejercicio4-new \
              --restart unless-stopped \
              -p 3001:3000 \
              $IMAGE
            
            # 2. Esperar a que el contenedor inicialice
            sleep 5
            
            # 3. Health check: validar que el nuevo contenedor responde correctamente
            if curl -sf http://localhost:3001/health; then
              echo "Health check exitoso. Activando nuevo contenedor..."
              
              # 4. Detener y eliminar contenedores previos para liberar el puerto 80
              docker stop mi-app || true
              docker rm mi-app || true
              docker stop lab5-2-ejercicio4 || true
              docker rm lab5-2-ejercicio4 || true
              
              # 5. Exponer el nuevo contenedor en el puerto publico 80
              docker run -d \
                --name lab5-2-ejercicio4 \
                --restart unless-stopped \
                -p 80:3000 \
                $IMAGE
              
              # 6. Limpiar el contenedor de validacion
              docker rm -f lab5-2-ejercicio4-new || true
            else
              echo "Health check FALLIDO. Cancelando despliegue y manteniendo version anterior."
              docker rm -f lab5-2-ejercicio4-new || true
              exit 1
            fi
            
            # 7. Limpieza de imagenes y contenedores huerfanos
            docker system prune -f
